name: Deploy LocalFix to GitHub Pages

on:
  push:
    branches: [feat/emergency-service-agent]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build frontend
        run: npm run build --prefix client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable GitHub Pages workflow deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if pages_config=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null); then
            build_type=$(printf '%s' "$pages_config" | jq -r '.build_type')
            if [ "$build_type" != "workflow" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4